name: wda

on:
  workflow_dispatch:
    inputs:
      wda_ref:
        description: 'WebDriverAgent ref (branch/tag)'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Clone WebDriverAgent
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.wda_ref || 'master' }}" \
            https://github.com/appium/WebDriverAgent.git wda
          cd wda && git log -1 --oneline

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build for testing (unsigned)
        run: |
          set -o pipefail
          cd wda
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath ./dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tail -50

      - name: Package unsigned ipa
        run: |
          set -e
          APP=$(find wda/dd/Build/Products -maxdepth 3 -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "APP=$APP"
          test -d "$APP"
          # 注意：手动 launch（不经过 testmanagerd）的 WDA 必须保留自带 XCTest 框架，
          # 否则 dyld 找不到 @rpath/XCTest.framework/XCTest 启动即崩（已在 17.2.1 实测）。
          # 只删 dSYM（Sideloadly 会把它当二进制签名导致 -40 失败）。
          if [ -d "$APP/Frameworks" ]; then
            echo "--- Frameworks ---"; ls "$APP/Frameworks" || true
          fi
          # dSYM 是调试符号、不是可执行文件；Sideloadly 会把它当二进制去签，直接失败
          #   （macho sign/edit failed (-40)）。整包塞进 Payload 前先清掉。
          rm -rf "$APP"/PlugIns/*.xctest.dSYM "$APP"/*.dSYM 2>/dev/null || true
          find "$APP" -name '*.dSYM' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name '.DS_Store' -delete 2>/dev/null || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -name '*.dSYM' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          zip -qry WebDriverAgentRunner.ipa Payload
          ls -la WebDriverAgentRunner.ipa
          unzip -l WebDriverAgentRunner.ipa | head -12

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wda-ipa
          path: WebDriverAgentRunner.ipa
          retention-days: 7
          if-no-files-found: error
