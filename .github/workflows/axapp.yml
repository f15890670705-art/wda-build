name: axapp
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Unpack embedded frameworks
        working-directory: axapp
        run: |
          mkdir -p Sources/AXTouch/Frameworks
          unzip -o frameworks.zip -d Sources/AXTouch/Frameworks
          ls Sources/AXTouch/Frameworks
      - name: Generate project
        working-directory: axapp
        run: xcodegen generate
      - name: Build
        working-directory: axapp
        run: |
          set -o pipefail
          xcodebuild -project AXTouch.xcodeproj -scheme AXTouch \
            -sdk iphoneos -configuration Release -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 build 2>&1 | tail -200
          test -f dd/Build/Products/Release-iphoneos/AXTouch.app/AXTouch
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/AXTouch.app Payload/
          echo "--- app content ---"
          ls Payload/AXTouch.app
          du -sh Payload/AXTouch.app
          zip -qry AXTouch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: axapp-ipa
          path: axapp/AXTouch.ipa
