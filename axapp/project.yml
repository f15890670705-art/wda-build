name: AXTouch
options:
  bundleIdPrefix: com.hb.ax
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  AXTouch:
    type: application
    platform: iOS
    sources:
      - path: Sources/AXTouch
        excludes:
          - "Frameworks/**"
      - path: Sources/AXTouch/Frameworks
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AXTouch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: AXTouch needs local network for control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ascript.webdriveragentrunner.xctrunner
        PRODUCT_NAME: AXTouch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
