name: AXTouch
options:
  bundleIdPrefix: com.hb.ax
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  AXTouch:
    type: application
    platform: iOS
    sources:
      - path: Sources/AXTouch
        excludes:
          - "Frameworks/**"
      - path: Sources/AXTouch/Frameworks
        type: folder
        buildPhase: resources
    # H.264 推流需要的系统框架（AXAgent.mm 里用 VideoToolbox 编码）
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: ImageIO.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: hbVideo
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "50"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: AXTouch needs local network for control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heibai.video.core
        PRODUCT_NAME: AXTouch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AXTouch/Bridging-Header.h
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
